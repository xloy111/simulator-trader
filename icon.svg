<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Черный фон с закруглениями -->
  <rect width="512" height="512" rx="100" fill="#0a0a0a"/>
  
  <!-- Едва заметная сетка на фоне -->
  <g stroke="#1a1a1a" stroke-width="2" opacity="0.5">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Свеча-график (декор) -->
  <rect x="330" y="180" width="16" height="60" fill="#00e676" opacity="0.6"/>
  <rect x="350" y="220" width="16" height="80" fill="#ff3d00" opacity="0.6"/>
  <rect x="370" y="160" width="16" height="100" fill="#00e676" opacity="0.6"/>

  <!-- Оранжевый знак доллара с неоновым свечением -->
  <text x="256" y="360" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="url(#dollarGrad)" text-anchor="middle" filter="url(#glow)">$</text>
</svg>